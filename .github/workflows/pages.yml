# Faz o build do bleh 3 e publica no branch gh-pages (GitHub Pages).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/new-session-w3wo4o]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Publicar dist no branch gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Publica com um commit novo em cima do gh-pages (sem push forçado,
          # que o GitHub recusa neste repositório).
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch gh-pages "$REMOTE" site; then
            echo "gh-pages existente"
          else
            mkdir site && git -C site init -q -b gh-pages && git -C site remote add origin "$REMOTE"
          fi
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou no site."
            exit 0
          fi
          git commit -qm "Publica ${GITHUB_SHA::7}"
          git push origin gh-pages
